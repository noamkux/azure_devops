name: $(Date:yyyy.MM.dd)$1.0.$(BuildID)

trigger: none

pool:
  vmImage: "ubuntu-latest"

variables:
  buildConfiguration: "Release"

steps:
  - task: UseDotNet@2
    displayName: "Install .NET SDK"
    inputs:
      packageType: "sdk"
      version: "10.x"

  - task: DotNetCoreCLI@2
    inputs:
      command: "pack"
      packagesToPack: "**/*.csproj"
      versioningScheme: "byBuildNumber"

  - task: DotNetCoreCLI@2
    inputs:
      azureSubscription: 'Azure subscription 1(9d1c0930-9a96-403c-b635-ccd0e0e7bf66)'
      command: 'push'
      packagesToPush: '$(Build.ArtifactStagingDirectory)/*.nupkg'
      nuGetFeedType: 'internal'
      publishVstsFeed: 'e46d6841-9a5d-4aa1-a922-5583f90fe3d5'